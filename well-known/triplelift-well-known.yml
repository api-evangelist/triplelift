    note: >-
      FALSE POSITIVE — the console is a single-page app whose catch-all route
      returns the same 150KB HTML shell with HTTP 200 for EVERY /.well-known/
      path, including agent-card.json. Not a document. Recorded as a miss.
  - host: console.triplelift.com
    path: /.well-known/agent-card.json
