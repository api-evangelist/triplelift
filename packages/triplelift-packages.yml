    published: '2018-05-14'
    repository: https://github.com/triplelift/IAB-Consent-String-Parser
    note: >-
      A genuine standards-implementation contribution, published under TripleLift's
      own Maven group. Last release 2018-05-14. It implements TCF v1.1 consent
      strings; IAB Europe replaced that framework with TCF v2.0 in 2020 and TCF
      v2.2 in 2023, so the published artifact parses a consent format the industry
      has retired. The source repo's last commit is 2020-05-13.
