name: TripleLift Packages and SDKs
description: >-
  Every first-party TripleLift distributable found across npm, Maven Central, PyPI,
  RubyGems, CocoaPods and the github.com/triplelift organisation. The finding is
  decay: TripleLift has published first-party client code, but nothing has shipped
  since 2019 on npm and 2018 on Maven Central, while the API those libraries would
  wrap has been changing every six to eight weeks through 2026. There is no client
  library for the Reporting API — the API TripleLift actually documents — in any
  language.
generated: '2026-08-12'
method: searched
source: registry.npmjs.org, search.maven.org, pypi.org, rubygems.org, trunk.cocoapods.org, api.github.com/orgs/triplelift
