observations:
  - >-
    The most current first-party TripleLift release in any package registry is from
    2019. The Reporting API changelog shows twelve months of continuous schema
    change through 2026. Every first-party SDK predates the API surface it would be
    used against, which is the abandonment signal this pipeline is designed to catch.
  - >-
    There is no SDK, client library, or generated stub for the Reporting API in any
    language. TripleLift's own integration guidance for it is a cURL example and a
    third-party desktop GraphQL client (Altair).
  - >-
    None of the twelve repositories in github.com/triplelift is marked archived, and
    the newest push across the whole organisation is 2020-09-10. The org presents a
    dozen live-looking repositories, all of them dormant for at least six years.
