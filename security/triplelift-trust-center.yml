gaps:
  - >-
    A Trust Center whose contents require a JavaScript runtime cannot be read by a
    procurement bot, a security-questionnaire agent, or any automated vendor-risk
    process — which is the audience a Trust Center exists to serve. The platform
    supports guest access; the barrier here is rendering, not authorization.
  - >-
    No /.well-known/security.txt is served on any TripleLift host, so there is no
    machine-discoverable security contact or disclosure policy pointing at the
    Trust Center either.
