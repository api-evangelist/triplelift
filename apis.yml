aid: triplelift
name: TripleLift
description: TripleLift is a programmatic advertising exchange and supply-side platform
  built around native inventory, with a public developer surface in two parts. The
  TripleLift Exchange (TLX) is an IAB OpenRTB 2.x server-to-server auction endpoint for
  native, banner, video and connected TV, geo-load balanced across four AWS regions, with
  user-sync endpoints carrying GDPR TCF, us_privacy and GPP consent signals and
  SKAdNetwork support for iOS attribution. The TripleLift Reporting API is a GraphQL API
  for publishers and supply partners covering standard and CTV network reporting, with
  synchronous cursor-paginated queries and asynchronous CSV export by pre-signed download
  or email. TripleLift also publishes sellers.json, a component-level status page, a
  dated Reporting API changelog, and Prebid.js and Prebid Server bid adapters.
