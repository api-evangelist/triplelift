  - name: TripleLift Reporting API
    description: GraphQL API for publishers and supply partners covering standard and
      connected TV (CTV) network reporting. A single unversioned endpoint exposes
      publisherNetworkReport and ctvPublisherNetworkReport plus their filter-option and
      asynchronous CSV export counterparts, with cursor pagination, a 5,000-row
      synchronous ceiling, and published rate limits of one request per five seconds and
      1,000 requests per day per API key. Authentication requires a paired X-API-Key
      header and a monthly-expiring Bearer JWT. Previously catalogued as a REST "Supply
      Publisher API" with versioned endpoints; corrected 2026-08-12 from the provider's
      own documentation.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
