apis:
  - name: TripleLift Exchange (TLX) API
    description: Real-time bidding API implementing OpenRTB 2.x and Native Ads 1.2
      specifications for demand partners to participate in native, banner, and video
      ad auctions. Supports bid request and response objects, user sync, win notifications,
      privacy compliance (GDPR, CCPA), and SKAdNetwork for iOS attribution.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://docs.triplelift.com
    baseURL: https://tlx.3lift.com
    tags:
