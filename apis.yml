aid: triplelift
name: TripleLift
description: TripleLift is a programmatic advertising company specializing in native
  inventory with APIs for managing native ad units, deals, targeting, viewability
  measurement, and creative quality. The platform provides OpenRTB-compliant exchange
  APIs for demand and supply partners, publisher network reporting, connected TV (CTV)
  advertising, and mobile SDKs for iOS and Android.
