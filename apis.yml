  - name: TripleLift Supply Publisher API
    description: REST API for supply partners and publishers to access network reporting,
      connected TV publisher network reports, and integration management. Provides
      synchronous and asynchronous query capabilities with rate limiting and versioned
      endpoints (v1.0 through v1.3).
