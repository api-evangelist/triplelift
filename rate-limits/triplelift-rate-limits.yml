name: TripleLift Rate Limits
description: TripleLift applies rate limiting to its Supply Publisher API. The Exchange
  (TLX) RTB API enforces a strict bidder response timeout of 100ms — demand partners
  must respond to bid requests within this window or be timed out. Specific numeric
  rate limits for the REST reporting APIs are not publicly disclosed and are governed
  by partner agreement.
rateLimits:
  - api: TripleLift Exchange (TLX) RTB API
    type: Response Timeout
    limit: 100ms
    description: Demand partners (DSPs) must respond to bid requests within 100 milliseconds.
      Bids arriving after this window are timed out and not considered in the auction.
    enforcement: Hard timeout enforced by the exchange
  - api: TripleLift Supply Publisher API
    type: Request Rate Limiting
    limit: Not publicly disclosed
    description: The Supply Publisher API documentation references a Rate Limiting
      section but does not publicly specify numeric thresholds. Rate limits are communicated
      during partner onboarding and governed by the publisher agreement.
    documentation: https://supply-docs.triplelift.com/reference/rate-limiting
  - api: TripleLift Supply Publisher API — Querying Guidelines
    type: Query Best Practices
    limit: See Querying Guidelines documentation
    description: TripleLift publishes querying guidelines for the Publisher Network
      Report and CTV Publisher Network Report APIs covering recommended query patterns,
      date range constraints, and pagination to avoid overloading reporting endpoints.
    documentation: https://supply-docs.triplelift.com/reference/querying-guidelines
assetLimits:
  - asset: Native Ad Title
    limit: 75 characters maximum
  - asset: Native Ad Description
    limit: 200 characters maximum
  - asset: Native Ad Advertiser Name
    limit: 25 characters maximum
  - asset: Native Ad Logo
    limit: 25px minimum width and height
  - asset: Native Ad Image Ratio
    limit: Must be within 0.5x to 2.0x of the target image ratio
notes:
  - Specific numeric API rate limits are not publicly documented
  - RTB bidder timeout of 100ms is the key operational constraint for demand partners
  - Production integrations are recommended to be ramped during US Eastern business hours
